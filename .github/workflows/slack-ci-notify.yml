name: Slack CI Failure Notifier

on:
  workflow_run:
    workflows: ["NA Bug-Fixer CI"]
    types: [completed]
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: 'C0B0NHJ0U9Z'
          slack-message: |
            :x: *NA Bug-Fixer CI failed on `main`*
            Commit: `${{ github.event.workflow_run.head_commit.message }}`
            By: ${{ github.event.workflow_run.head_commit.author.name }}
            <${{ github.event.workflow_run.html_url }}|View run>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
